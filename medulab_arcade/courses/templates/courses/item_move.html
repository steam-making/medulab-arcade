{% extends "arcade/base.html" %}
{% block title %}아이템 이동 - {{ item.title }}{% endblock %}

{% block extra_css %}
<style>
    .manage-container { max-width: 600px; margin: 40px auto; }
    .form-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
    }
    .item-info {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
    }
    .item-info strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .item-info span { color: var(--text-secondary); font-size: 13px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: var(--text-secondary); }
    .form-select { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; outline: none; cursor: pointer; }
    .form-select option { background: #1e293b; color: #fff; }
    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; border: none; text-align: center; text-decoration: none; }
    .btn-submit { background: var(--accent-green); color: var(--bg-primary); box-shadow: 0 4px 15px rgba(0,255,180,0.2); }
    .btn-submit:hover { transform: translateY(-2px); }
    .btn-cancel { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
{% endblock %}

{% block content %}
<main class="main manage-container">
    <div class="admin-header" style="margin-bottom: 24px;">
        <h1 style="font: 900 24px 'Orbitron', sans-serif;">아이템 이동</h1>
    </div>
    <div class="form-card">
        <div class="item-info">
            <strong>{{ item.title }}</strong>
            <span>현재: 제 {{ item.chapter.number }}장. {{ item.chapter.title }} → 아이템 #{{ item.number }}</span>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>이동할 챕터 선택</label>
                <select name="target_chapter" class="form-select" required>
                    <option value="">-- 챕터 선택 --</option>
                    {% for ch in chapters %}
                    <option value="{{ ch.id }}">제 {{ ch.number }}장. {{ ch.title }} (아이템 {{ ch.items.count }}개)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="btn-group">
                <a href="{% url 'chapter_manage' program.id %}" class="btn btn-cancel">취소</a>
                <button type="submit" class="btn btn-submit">이동</button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
