<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업로드 완료 - MEDULAB</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d1a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(0,255,180,0.07);
    border: 1px solid rgba(0,255,180,0.28);
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
  }
  .icon { font-size: 52px; margin-bottom: 16px; }
  .title { font-size: 22px; font-weight: 900; color: #00ffb4; margin-bottom: 10px; }
  .desc { color: #94a3b8; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <div class="title">업로드 완료!</div>
  <div class="desc">
    <strong>문제 {{ item.number }}-{{ sq.number }}</strong> 손글씨 답안 사진이<br>
    성공적으로 제출되었습니다.<br><br>
    이 페이지를 닫고 컴퓨터 화면으로 돌아가세요.
  </div>
</div>
</body>
</html>
