# /etc/nginx/sites-available/medulab_arcade
# 두 도메인 모두 HTTPS로 서비스 (medulab.steam-making.com + medulab.kr)

# HTTP → HTTPS 리다이렉트 (모든 도메인)
server {
    listen 80;
    server_name medulab.steam-making.com medulab.kr www.medulab.kr;
    return 301 https://$host$request_uri;
}

# ── medulab.steam-making.com ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name medulab.steam-making.com;

    ssl_certificate     /etc/letsencrypt/live/medulab.steam-making.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medulab.steam-making.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location /static/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/media/;
        expires 7d;
    }

    location /media/projects/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/media/projects/;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src * data:; media-src *;";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── medulab.kr / www.medulab.kr ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name medulab.kr www.medulab.kr;

    ssl_certificate     /etc/letsencrypt/live/medulab.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medulab.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # www → non-www 리다이렉트
    if ($host = www.medulab.kr) {
        return 301 https://medulab.kr$request_uri;
    }

    location /static/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/media/;
        expires 7d;
    }

    location /media/projects/ {
        alias /home/deploy/medulab_arcade/medulab_arcade/media/projects/;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src * data:; media-src *;";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
