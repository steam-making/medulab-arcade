# /etc/nginx/sites-available/medulab_arcade

server {
    listen 80;
    server_name your-domain.com;  # 도메인으로 변경

    client_max_body_size 50M;  # 업로드 파일 크기 제한

    # 정적 파일
    location /static/ {
        alias /home/deploy/medulab_arcade/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 미디어 파일 (학생 작품 포함)
    location /media/ {
        alias /home/deploy/medulab_arcade/media/;
        expires 7d;

        # 학생 작품 iframe에서 실행 가능하도록 설정
        location /media/projects/ {
            add_header X-Frame-Options SAMEORIGIN;
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src * data:; media-src *;";
        }
    }

    # Django 애플리케이션
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
