{% for post in posts %}
<button type="button" class="gal-item"
    data-media-type="{{ post.media_type }}"
    data-media-url="{{ post.media_url }}"
    data-thumbnail-url="{{ post.thumbnail_url }}"
    data-permalink="{{ post.permalink }}"
    data-caption="{{ post.caption }}"
    {% if post.children_json %}data-children="{{ post.children_json }}"{% endif %}>
    {% if post.media_type == 'VIDEO' %}
    <img src="{{ post.thumbnail_url|default:post.media_url }}" loading="lazy" alt="">
    <span class="badge">▶ 동영상</span>
    {% elif post.media_type == 'CAROUSEL_ALBUM' %}
    <img src="{{ post.media_url }}" loading="lazy" alt="">
    <span class="badge">🖼 {% if post.carousel_children %}{{ post.carousel_children|length }}{% else %}여러{% endif %}장</span>
    {% else %}
    <img src="{{ post.media_url }}" loading="lazy" alt="">
    {% endif %}
    {% if post.caption %}
    <div class="overlay"><div class="cap">{{ post.caption }}</div></div>
    {% endif %}
</button>
{% endfor %}
