{% extends 'arcade/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 80px auto; padding: 20px;">
    <div style="background: rgba(255,255,255,0.05); padding: 40px; border-radius: 16px; text-align: center;">
        <h2 style="color: #ef4444; font-size: 28px; font-weight: 800; margin-bottom: 16px;">⚠️ {{ title }}</h2>
        <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 30px;">
            정말로 이 항목을 삭제하시겠습니까?<br>
            <strong style="color: white; display: inline-block; margin-top: 10px;">"{{ object.title }}"</strong><br>
            삭제 후에는 복구할 수 없습니다.
        </p>
        
        <form method="post" style="display: flex; gap: 16px; justify-content: center;">
            {% csrf_token %}
            <a href="{{ cancel_url }}" style="padding: 12px 24px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">취소</a>
            <button type="submit" style="padding: 12px 24px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">삭제하기</button>
        </form>
    </div>
</div>
{% endblock %}
